<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E9EFEE">
<title>濟州 11/26–29</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #E9EFEE;
    --paper: #FFFFFF;
    --basalt: #2B3036;
    --stone: #6B7378;
    --line: #CDD6D5;
    --tangerine: #EE7F1B;
    --olle: #2F64A8;
    --done: #A9B2B4;
    --num: "Bricolage Grotesque", "Noto Sans TC", sans-serif;
    --body: "Noto Sans TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--mist); color: var(--basalt);
    font: 16px/1.6 var(--body);
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--olle); outline-offset: 2px; border-radius: 6px; }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px 64px; }

  /* Header */
  header.top { padding: 22px 0 8px; }
  .trip-title {
    font: 700 34px/1.1 var(--num); letter-spacing: -0.5px; margin: 0;
  }
  .trip-title .ko { font: 500 15px/1 var(--body); color: var(--stone); margin-left: 6px; letter-spacing: 0; }
  .countdown { margin: 6px 0 0; color: var(--stone); font-size: 14px; }
  .countdown strong { color: var(--tangerine); font-family: var(--num); font-size: 18px; }

  /* Day tabs */
  nav.days {
    position: sticky; top: 0; z-index: 5; background: var(--mist);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 10px 0; margin: 0 -2px;
  }
  .day-tab {
    border: 0; background: transparent; border-radius: 12px; padding: 8px 4px 7px;
    text-align: center; cursor: pointer; line-height: 1.2;
  }
  .day-tab .d { display: block; font: 700 20px/1.1 var(--num); }
  .day-tab .w { display: block; font-size: 12px; color: var(--stone); margin-top: 2px; }
  .day-tab[aria-selected="true"] { background: var(--basalt); color: var(--mist); }
  .day-tab[aria-selected="true"] .w { color: #C9D2D1; }
  .day-tab .today-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--tangerine); vertical-align: middle; margin-left: 3px; }

  /* Day heading */
  .day-head { margin: 14px 0 4px; }
  .day-head h2 { font-size: 22px; font-weight: 700; margin: 0; line-height: 1.35; }
  .day-head p { margin: 2px 0 0; color: var(--stone); font-size: 14px; }

  /* Map */
  .map { margin: 12px 0 6px; }
  .map svg { width: 100%; height: auto; display: block; background: #D3E2E5; border-radius: 16px; }
  .map .island { fill: #F3F5F1; stroke: #B7C7C6; stroke-width: 1.5; }
  .map .label { font: 500 11px var(--body); fill: var(--stone); }
  .map .route { fill: none; stroke: var(--tangerine); stroke-width: 2.5; stroke-dasharray: 6 5; stroke-linecap: round; }
  .map .pin circle { fill: var(--basalt); stroke: var(--mist); stroke-width: 2; }
  .map .pin text { font: 700 11px var(--num); fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .map .pin.is-done circle { fill: var(--done); }
  .map .pin.is-next circle { fill: var(--tangerine); }
  .map .pin { cursor: pointer; }
  .map .ghost { fill: #C3CDCC; }
  .map-note { font-size: 12px; color: var(--stone); margin: 0; }

  /* Timeline */
  ol.timeline { list-style: none; margin: 18px 0 0; padding: 0; }
  .stop {
    display: grid; grid-template-columns: 64px 22px 1fr; column-gap: 10px;
    position: relative;
  }
  .stop .time {
    font: 700 19px/1 var(--num); padding-top: 3px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  /* Olle ribbon: the trail's blue and tangerine ribbons, twisted */
  .stop .rail { position: relative; }
  .stop .rail::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 5px; transform: translateX(-50%);
    background: repeating-linear-gradient(160deg, var(--olle) 0 9px, var(--tangerine) 9px 18px);
    border-radius: 3px;
  }
  .stop:first-child .rail::before { top: 10px; }
  .stop:last-child .rail::before { bottom: auto; height: 12px; }
  .stop .dot {
    position: relative; z-index: 1; margin: 2px auto 0; width: 20px; height: 20px; border-radius: 50%;
    background: var(--basalt); color: #fff; font: 700 11px/20px var(--num); text-align: center;
    border: 2px solid var(--mist);
  }
  .stop.is-move .dot { background: var(--mist); border: 2px solid var(--stone); color: var(--stone); width: 14px; height: 14px; margin-top: 5px; }
  .stop.is-flight .dot { background: var(--olle); }
  .stop.is-next .dot { background: var(--tangerine); }
  .stop.is-done .dot { background: var(--done); }

  .body { padding-bottom: 22px; min-width: 0; }
  .body h3 { margin: 0; font-size: 17px; line-height: 1.4; font-weight: 700; }
  .stop.is-done .body h3 { color: var(--stone); text-decoration: line-through; text-decoration-color: var(--done); }
  .body .ko { font-size: 13px; color: var(--stone); margin: 1px 0 0; }
  .body .meta { font-size: 13px; color: var(--stone); margin: 2px 0 0; }
  .next-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--tangerine); margin-left: 6px; vertical-align: 2px; }
  .tips { margin: 6px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .tips li { padding-left: 12px; position: relative; }
  .tips li::before { content: ""; position: absolute; left: 0; top: .72em; width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
  .stop.is-done .tips { display: none; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer;
    min-height: 34px;
  }
  .btn.primary { background: var(--basalt); border-color: var(--basalt); color: #fff; }
  .btn.check[aria-pressed="true"] { border-color: var(--done); color: var(--stone); }
  .stop.is-done .actions .nav-btn { display: none; }

  .empty {
    margin: 24px 0; padding: 22px 18px; background: var(--paper); border-radius: 16px;
    border: 1px dashed var(--line);
  }
  .empty h3 { margin: 0 0 4px; font-size: 17px; }
  .empty p { margin: 0; color: var(--stone); font-size: 14px; }

  footer.info { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; }
  footer.info h2 { font-size: 15px; margin: 0 0 8px; }
  footer.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  footer.info dt { color: var(--stone); }
  footer.info dd { margin: 0; }
  .error { color: #B23A2B; }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
    .stop.flash .body { animation: flash 1.2s ease-out; }
    @keyframes flash { from { background: rgba(238,127,27,.18); } to { background: transparent; } }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="trip-title">濟州 <span class="ko">제주도</span></h1>
    <p class="countdown" id="countdown"></p>
  </header>

  <nav class="days" role="tablist" aria-label="選擇哪一天" id="tabs"></nav>

  <main id="main" aria-live="polite"></main>

  <footer class="info" id="info"></footer>
</div>

<script>
(() => {
  const CAT = {
    experience: "體驗", walk: "散步", nature: "自然", history: "歷史", sunset: "夕陽",
    food: "吃飯", beach: "海邊", drive: "兜風", transport: "移動"
  };
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  const store = {
    get() { try { return JSON.parse(localStorage.getItem("jeju-done") || "{}"); } catch { return {}; } },
    set(v) { try { localStorage.setItem("jeju-done", JSON.stringify(v)); } catch {} }
  };
  let done = store.get();
  let trip = null;
  let current = 0;

  // Current time in Korea (UTC+9)
  function kstNow() {
    const k = new Date(Date.now() + 9 * 3600e3);
    return {
      date: k.toISOString().slice(0, 10),
      min: k.getUTCHours() * 60 + k.getUTCMinutes()
    };
  }
  const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const shortRegion = r => !r || r === "TBD" ? "待補" : r.split("（")[0];

  // Map projection for Jeju (lng/lat -> SVG)
  const S = 1000, LNG0 = 126.10, LAT0 = 33.60, KX = 0.835;
  const px = (lng, lat) => [((lng - LNG0) * KX * S), ((LAT0 - lat) * S)];
  const COAST = [
    [126.162,33.300],[126.165,33.335],[126.185,33.360],[126.230,33.395],[126.270,33.420],[126.310,33.455],
    [126.360,33.475],[126.420,33.490],[126.490,33.510],[126.530,33.520],[126.600,33.530],[126.670,33.545],
    [126.750,33.565],[126.820,33.555],[126.870,33.525],[126.920,33.500],[126.945,33.460],[126.920,33.430],
    [126.860,33.370],[126.830,33.320],[126.750,33.290],[126.660,33.265],[126.580,33.245],[126.500,33.235],
    [126.420,33.240],[126.360,33.235],[126.320,33.225],[126.300,33.205],[126.290,33.195],[126.250,33.210],
    [126.210,33.240],[126.175,33.270]
  ];
  function coastPath() {
    const p = COAST.map(([a, b]) => px(a, b));
    const mid = (i) => { const a = p[i], b = p[(i + 1) % p.length]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
    let d = `M${mid(p.length - 1).map(n => n.toFixed(1)).join(",")}`;
    p.forEach((pt, i) => { const m = mid(i); d += ` Q${pt[0].toFixed(1)},${pt[1].toFixed(1)} ${m[0].toFixed(1)},${m[1].toFixed(1)}`; });
    return d + "Z";
  }
  const COAST_D = coastPath();

  function stopKey(day, i) { return `${day.date}#${i}`; }

  function nextIndex(day) {
    const now = kstNow();
    if (now.date !== day.date) return -1;
    let idx = day.stops.findIndex((s, i) => !done[stopKey(day, i)] && s.category !== "transport" && toMin(s.time) + (s.duration_min || 30) > now.min);
    return idx;
  }

  function navLinks(s) {
    const q = encodeURIComponent(s.name_ko || s.name);
    const out = [];
    if (s.lat != null && s.lng != null) {
      out.push(`<a class="btn primary nav-btn" href="https://map.kakao.com/link/to/${q},${s.lat},${s.lng}" target="_blank" rel="noopener">Kakao 導航</a>`);
    } else if (s.category === "transport") {
      return "";
    } else if (s.name_ko) {
      out.push(`<a class="btn primary nav-btn" href="https://map.kakao.com/link/search/${q}" target="_blank" rel="noopener">Kakao 搜尋</a>`);
    }
    if (s.name_ko) out.push(`<a class="btn nav-btn" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">Naver 地圖</a>`);
    return out.join("");
  }

  function renderMap(day, nextIdx) {
    const pinned = day.stops.map((s, i) => ({ s, i })).filter(o => o.s.lat != null && o.s.category !== "transport" || (o.s.lat != null && /機場/.test(o.s.name)));
    const others = trip.days.filter(d => d !== day).flatMap(d => d.stops).filter(s => s.lat != null);
    const route = pinned.map(o => px(o.s.lng, o.s.lat).map(n => n.toFixed(1)).join(",")).join(" ");
    const labels = [
      { t: "濟州市", lng: 126.53, lat: 33.50, dy: 16 },
      { t: "西歸浦", lng: 126.56, lat: 33.255, dy: -10 },
      { t: "漢拏山 ▲", lng: 126.533, lat: 33.362, dy: 4 },
      { t: "翰林", lng: 126.27, lat: 33.41, dy: 14 },
      { t: "中文", lng: 126.42, lat: 33.255, dy: -6 }
    ];
    const order = new Map(); let n = 0;
    day.stops.forEach((s, i) => { if (s.category !== "transport") order.set(i, ++n); });
    // Fit the view to this day's stops so pins stay readable on a phone
    const pts = pinned.map(o => px(o.s.lng, o.s.lat));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    let [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    let w = Math.max(x1 - x0 + 120, 320), h = Math.max(y1 - y0 + 90, w * 0.48);
    w = Math.max(w, h / 0.48);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const vb = [cx - w / 2, cy - h / 2, w, h].map(n => n.toFixed(1)).join(" ");
    const f = w / 360; // scale so labels and pins render at the same size on screen
    return `
      <div class="map">
        <svg viewBox="${vb}" role="img" aria-label="${esc(day.date)} 的路線圖">
          <path class="island" d="${COAST_D}" vector-effect="non-scaling-stroke"/>
          ${labels.map(l => { const [x, y] = px(l.lng, l.lat); return `<text class="label" style="font-size:${(11 * f).toFixed(1)}px" x="${x.toFixed(0)}" y="${(y + l.dy * f).toFixed(0)}" text-anchor="middle">${l.t}</text>`; }).join("")}
          ${others.map(s => { const [x, y] = px(s.lng, s.lat); return `<circle class="ghost" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(3 * f).toFixed(1)}"/>`; }).join("")}
          ${pinned.length > 1 ? `<polyline class="route" points="${route}" vector-effect="non-scaling-stroke"/>` : ""}
          ${pinned.map(({ s, i }) => {
            const [x, y] = px(s.lng, s.lat);
            const cls = ["pin", done[stopKey(day, i)] ? "is-done" : "", i === nextIdx ? "is-next" : ""].join(" ");
            const label = order.has(i) ? order.get(i) : "✈";
            return `<g class="${cls}" data-go="${i}" tabindex="0" role="button" aria-label="跳到 ${esc(s.name)}">
              <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(10 * f).toFixed(1)}" style="stroke-width:${(2 * f).toFixed(1)}"/>
              <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${(10 * f).toFixed(1)}px">${label}</text></g>`;
          }).join("")}
        </svg>
      </div>
      <p class="map-note">點地圖上的編號可以跳到那一站</p>`;
  }

  function flightRow(f, kind) {
    const isArr = kind === "arr";
    return `<li class="stop is-flight">
      <div class="time">${isArr ? f.arr : f.dep}</div>
      <div class="rail"><div class="dot">✈</div></div>
      <div class="body">
        <h3>${isArr ? "抵達濟州機場" : "起飛回臺中"}</h3>
        <p class="meta">${esc(f.airline)} ${esc(f.flight)}・${esc(f.from)} → ${esc(f.to)}・${f.dep}–${f.arr}</p>
      </div></li>`;
  }

  function renderDay() {
    const day = trip.days[current];
    const wd = WEEK[new Date(day.date + "T12:00:00+09:00").getUTCDay()];
    const main = document.getElementById("main");
    const arr = trip.trip.flights.find(f => f.date === day.date && f.to === "CJU");
    const dep = trip.trip.flights.find(f => f.date === day.date && f.from === "CJU");

    let html = `<section class="day-head">
      <h2>Day ${day.day}｜${esc(day.region === "TBD" ? "行程待補" : day.region)}</h2>
      <p>${day.date.slice(5).replace("-", "/")}（${wd}）${day.stay ? "・住 " + esc(day.stay) : ""}</p>
    </section>`;

    if (!day.stops.length) {
      html += `<ol class="timeline">${arr ? flightRow(arr, "arr") : ""}</ol>
        <div class="empty"><h3>這天的行程還沒放進來</h3>
        <p>朋友排好後，加進 <code>data/itinerary.json</code> 的 Day ${day.day} 就會出現在這裡。</p></div>`;
      main.innerHTML = html;
      return;
    }

    const nextIdx = nextIndex(day);
    html += renderMap(day, nextIdx);
    let n = 0;
    html += `<ol class="timeline">${arr ? flightRow(arr, "arr") : ""}`;
    day.stops.forEach((s, i) => {
      const key = stopKey(day, i);
      const isMove = s.category === "transport";
      const isDone = !!done[key];
      const num = isMove ? "" : ++n;
      const cls = ["stop", isMove ? "is-move" : "", isDone ? "is-done" : "", i === nextIdx ? "is-next" : ""].join(" ");
      html += `<li class="${cls}" id="stop-${i}">
        <div class="time">${esc(s.time)}</div>
        <div class="rail"><div class="dot">${num}</div></div>
        <div class="body">
          <h3>${esc(s.name)}${i === nextIdx ? `<span class="next-tag">下一站</span>` : ""}</h3>
          ${s.name_ko ? `<p class="ko" lang="ko">${esc(s.name_ko)}</p>` : ""}
          <p class="meta">${CAT[s.category] || ""}${s.duration_min ? `・約 ${s.duration_min} 分` : ""}</p>
          ${s.tips && s.tips.length ? `<ul class="tips">${s.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
          <div class="actions">
            ${navLinks(s)}
            ${isMove ? "" : `<button class="btn check" type="button" data-check="${i}" aria-pressed="${isDone}">${isDone ? "取消已去過" : "去過了"}</button>`}
          </div>
        </div></li>`;
    });
    html += `${dep ? flightRow(dep, "dep") : ""}</ol>`;
    main.innerHTML = html;
  }

  function renderTabs() {
    const today = kstNow().date;
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = trip.days.map((d, i) => {
      const dt = new Date(d.date + "T12:00:00+09:00");
      return `<button class="day-tab" role="tab" type="button" data-day="${i}" aria-selected="${i === current}">
        <span class="d">${d.date.slice(5).replace("-", "/")}</span>
        <span class="w">${WEEK[dt.getUTCDay()]}・${esc(shortRegion(d.region))}${d.date === today ? `<span class="today-dot" aria-label="今天"></span>` : ""}</span>
      </button>`;
    }).join("");
  }

  function renderCountdown() {
    const el = document.getElementById("countdown");
    const start = trip.days[0].date, end = trip.days[trip.days.length - 1].date;
    const today = kstNow().date;
    const diff = Math.round((Date.parse(start) - Date.parse(today)) / 864e5);
    if (diff > 0) el.innerHTML = `還有 <strong>${diff}</strong> 天出發`;
    else if (today <= end) el.innerHTML = `旅行第 <strong>${-diff + 1}</strong> 天`;
    else el.textContent = "旅程結束了，下次見";
  }

  function renderInfo() {
    const t = trip.trip;
    const f = t.flights.map(x => `<dt>${x.date.slice(5).replace("-", "/")}</dt><dd>${esc(x.airline)} ${esc(x.flight)}　${esc(x.from)} ${x.dep} → ${esc(x.to)} ${x.arr}</dd>`).join("");
    const docs = t.transport && t.transport.docs ? `<dt>租車</dt><dd>帶：${t.transport.docs.map(esc).join("、")}</dd>` : "";
    const stay = t.lodging ? `<dt>住宿</dt><dd>${esc(t.lodging.area)}</dd>` : "";
    document.getElementById("info").innerHTML = `<h2>航班與提醒</h2><dl>${f}${docs}${stay}</dl>`;
  }

  function selectDay(i, focus) {
    current = i;
    try { localStorage.setItem("jeju-day", String(i)); } catch {}
    renderTabs(); renderDay();
    if (focus) document.querySelector(`[data-day="${i}"]`)?.focus();
  }

  document.addEventListener("click", e => {
    const tab = e.target.closest("[data-day]");
    if (tab) { selectDay(Number(tab.dataset.day)); return; }
    const chk = e.target.closest("[data-check]");
    if (chk) {
      const day = trip.days[current]; const key = stopKey(day, Number(chk.dataset.check));
      if (done[key]) delete done[key]; else done[key] = Date.now();
      store.set(done); renderDay(); return;
    }
    const go = e.target.closest("[data-go]");
    if (go) jump(Number(go.dataset.go));
  });
  document.addEventListener("keydown", e => {
    const go = e.target.closest && e.target.closest("[data-go]");
    if (go && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); jump(Number(go.dataset.go)); }
    const tab = e.target.closest && e.target.closest("[data-day]");
    if (tab && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const n = trip.days.length; selectDay((current + (e.key === "ArrowRight" ? 1 : n - 1)) % n, true);
    }
  });
  function jump(i) {
    const el = document.getElementById("stop-" + i);
    if (!el) return;
    el.scrollIntoView({ block: "center" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  function start(data) {
    trip = data;
    const today = kstNow().date;
    const todayIdx = trip.days.findIndex(d => d.date === today);
    let saved = null; try { saved = localStorage.getItem("jeju-day"); } catch {}
    current = todayIdx >= 0 ? todayIdx : (saved != null && trip.days[saved] ? Number(saved) : trip.days.findIndex(d => d.stops.length) || 0);
    renderCountdown(); renderTabs(); renderDay(); renderInfo();
    if (todayIdx >= 0) { const n = nextIndex(trip.days[todayIdx]); if (n >= 0) setTimeout(() => jump(n), 300); }
  }

  fetch("data/itinerary.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(start)
    .catch(() => {
      document.getElementById("main").innerHTML = `<p class="error">讀不到行程資料（data/itinerary.json）。請用網址開啟這個頁面，不要直接點開檔案。</p>`;
    });

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
