<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E9EFEE">
<title>濟州 11/26–29</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #E9EFEE;
    --paper: #FFFFFF;
    --basalt: #2B3036;
    --stone: #6B7378;
    --line: #D5DDDC;
    --tangerine: #EE7F1B;
    --olle: #2F64A8;
    --done: #A9B2B4;
    --c-experience: #EE7F1B;
    --c-walk: #3C8C88;
    --c-nature: #4E8A5B;
    --c-history: #6B6F8A;
    --c-sunset: #D9572E;
    --c-food: #C08A1E;
    --c-beach: #2F7FA0;
    --c-drive: #2F64A8;
    --c-transport: #8A9396;
    --num: "Bricolage Grotesque", "Noto Sans TC", sans-serif;
    --body: "Noto Sans TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--mist); color: var(--basalt); font: 16px/1.6 var(--body); }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--olle); outline-offset: 2px; border-radius: 8px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 72px; }

  /* Top bar */
  .topbar { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 2px 4px; }
  .brand { font: 800 22px/1 var(--num); margin: 0; letter-spacing: -.3px; }
  .brand span { font: 500 13px/1 var(--body); color: var(--stone); margin-left: 6px; }
  .countdown { font-size: 13px; color: var(--stone); }
  .countdown strong { font: 800 20px/1 var(--num); color: var(--tangerine); margin: 0 2px; }

  /* Day tabs */
  nav.days {
    position: sticky; top: 0; z-index: 10; background: var(--mist);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 0 10px;
  }
  .day-tab {
    border: 0; background: rgba(255,255,255,.55); border-radius: 14px; padding: 8px 4px 7px;
    text-align: center; cursor: pointer; line-height: 1.2; position: relative;
  }
  .day-tab .d { display: block; font: 700 19px/1.1 var(--num); }
  .day-tab .w { display: block; font-size: 12px; color: var(--stone); margin-top: 3px; }
  .day-tab .bar { position: absolute; left: 30%; right: 30%; bottom: 4px; height: 3px; border-radius: 2px; }
  .day-tab[aria-selected="true"] { background: var(--basalt); color: #fff; }
  .day-tab[aria-selected="true"] .w { color: #C9D2D1; }
  .today-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--tangerine); vertical-align: middle; margin-left: 3px; }

  /* Cover */
  .cover { position: relative; border-radius: 24px; overflow: hidden; margin-top: 4px; color: #fff; isolation: isolate; }
  .cover svg.art { display: block; width: 100%; height: 230px; }
  .cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,24,30,.0) 30%, rgba(20,24,30,.62) 100%); z-index: 1; }
  .cover .text { position: absolute; left: 20px; right: 20px; bottom: 16px; z-index: 2; }
  .cover .dayno { font: 800 15px/1 var(--num); opacity: .9; letter-spacing: .2px; }
  .cover h2 { margin: 4px 0 2px; font: 900 34px/1.1 var(--body); letter-spacing: 1px; text-shadow: 0 1px 12px rgba(0,0,0,.25); }
  .cover p { margin: 0; font-size: 14px; opacity: .95; }
  .cover p.stats { font: 700 13px/1.4 var(--num); opacity: .8; margin-top: 2px; }

  /* Weather */
  .wx { background: var(--paper); border-radius: 20px; margin-top: 12px; padding: 14px 16px 12px; }
  .wx-main { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; }
  .wx-icon svg { width: 52px; height: 52px; display: block; }
  .wx-temp { font: 800 30px/1 var(--num); letter-spacing: -.5px; }
  .wx-temp .lo { color: var(--stone); font-weight: 700; font-size: 22px; }
  .wx-desc { font-size: 14px; color: var(--stone); margin-top: 4px; }
  .wx-sun { text-align: right; font-size: 12px; color: var(--stone); line-height: 1.5; }
  .wx-sun b { display: block; font: 800 22px/1.1 var(--num); color: var(--c-sunset); }
  .wx-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .wx-stats div { font-size: 12px; color: var(--stone); }
  .wx-stats b { display: block; font: 700 17px/1.2 var(--num); color: var(--basalt); }
  .wx-tip { margin: 10px 0 0; font-size: 14px; background: #FFF4E8; color: #8A4A0E; border-radius: 12px; padding: 8px 12px; }
  .wx-src { margin: 8px 0 0; font-size: 11px; color: var(--stone); }

  /* Map */
  .map { margin-top: 12px; }
  .map svg { width: 100%; height: auto; display: block; background: #D3E2E5; border-radius: 20px; }
  .map .island { fill: #F3F5F1; stroke: #B7C7C6; stroke-width: 1.5; }
  .map .label { font-family: var(--body); font-weight: 500; fill: var(--stone); }
  .map .route { fill: none; stroke: var(--tangerine); stroke-width: 2.5; stroke-dasharray: 6 5; stroke-linecap: round; }
  .map .pin circle { fill: var(--basalt); stroke: #fff; }
  .map .pin text { font-family: var(--num); font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .map .pin.is-done circle { fill: var(--done); }
  .map .pin.is-next circle { fill: var(--tangerine); }
  .map .pin { cursor: pointer; }
  .map .ghost { fill: #C3CDCC; }
  .map-note { font-size: 12px; color: var(--stone); margin: 6px 4px 0; }

  /* Timeline */
  .section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 2px 10px; }
  .section-h h3 { margin: 0; font-size: 18px; }
  .section-h span { font-size: 13px; color: var(--stone); }
  ol.timeline { list-style: none; margin: 0; padding: 0; }
  .stop { display: grid; grid-template-columns: 50px 22px 1fr; column-gap: 8px; }
  .stop .time { font: 700 17px/1 var(--num); padding-top: 18px; text-align: right; font-variant-numeric: tabular-nums; }
  .stop .rail { position: relative; }
  .stop .rail::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 5px; transform: translateX(-50%);
    background: repeating-linear-gradient(160deg, var(--olle) 0 9px, var(--tangerine) 9px 18px); border-radius: 3px;
  }
  .stop:first-child .rail::before { top: 20px; }
  .stop:last-child .rail::before { bottom: auto; height: 24px; }
  .stop .dot {
    position: relative; z-index: 1; margin: 15px auto 0; width: 22px; height: 22px; border-radius: 50%;
    background: var(--basalt); color: #fff; font: 700 11px/18px var(--num); text-align: center; border: 2px solid var(--mist);
  }
  .stop.is-move .dot { background: var(--mist); border: 2px solid var(--stone); width: 14px; height: 14px; margin-top: 19px; }
  .stop.is-flight .dot { background: var(--olle); font-size: 10px; }
  .stop.is-next .dot { background: var(--tangerine); }
  .stop.is-done .dot { background: var(--done); }

  .card { background: var(--paper); border-radius: 20px; padding: 14px 14px 12px; margin-bottom: 12px; min-width: 0; position: relative; }
  .stop.is-move .card { background: transparent; padding: 14px 4px 6px; }
  .stop.is-next .card { box-shadow: 0 0 0 2px var(--tangerine); }
  .stop.is-done .card { opacity: .62; }
  .card-head { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; }
  .cat-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
  .cat-ic svg { width: 22px; height: 22px; }
  .stop.is-move .cat-ic { display: none; }
  .stop.is-move .card-head { grid-template-columns: 1fr; }
  .card h4 { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 700; }
  .stop.is-move .card h4 { font-size: 15px; font-weight: 500; color: var(--stone); }
  .stop.is-done .card h4 { text-decoration: line-through; text-decoration-color: var(--done); }
  .card .sub { font-size: 13px; color: var(--stone); margin: 1px 0 0; }
  .chip { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; margin-right: 4px; }
  .next-tag { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: var(--tangerine); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
  .tips { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; }
  .tips li { padding-left: 14px; position: relative; }
  .tips li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
  .stop.is-move .tips { margin-top: 2px; font-size: 13px; color: var(--stone); }
  .stop.is-done .tips { display: none; }

  /* Sunset stops get the evening sky */
  .stop.is-sunset .card { background: linear-gradient(160deg, #FFE3C2 0%, #F7B98E 55%, #C98BA0 100%); }
  .sunset-time { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
  .sunset-time b { font: 800 26px/1 var(--num); color: #7A2E14; }
  .sunset-time span { font-size: 13px; color: #6B3A2A; }
  .stop.is-sunset .tips li::before { background: rgba(122,46,20,.35); }
  .stop.is-sunset .btn { background: rgba(255,255,255,.7); border-color: transparent; }
  .stop.is-sunset .btn.primary { background: #7A2E14; color: #fff; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; min-height: 34px;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn.primary { background: var(--basalt); border-color: var(--basalt); color: #fff; }
  .btn.check { margin-left: auto; }
  .btn.check[aria-pressed="true"] { color: var(--stone); }
  .stop.is-done .actions .nav-btn { display: none; }

  .flight-card { background: #E3ECF7; }
  .flight-card h4 { color: #1F4479; }


  /* Plan switch */
  .plan { margin-top: 12px; background: var(--paper); border-radius: 20px; padding: 12px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--mist); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; border-radius: 10px; padding: 8px 6px; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--stone); }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--basalt); box-shadow: 0 1px 3px rgba(43,48,54,.12); }
  .seg button[data-plan="rain"][aria-pressed="true"] { color: var(--c-beach); }
  .plan-note { margin: 8px 4px 0; font-size: 13px; color: var(--stone); }
  .plan-alert { margin: 8px 0 0; font-size: 14px; background: #E6F1F6; color: #1F5670; border-radius: 12px; padding: 8px 12px; }

  /* Drive legs */
  .leg { display: grid; grid-template-columns: 50px 22px 1fr; column-gap: 8px; }
  .leg .rail { position: relative; min-height: 34px; }
  .leg .rail::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 5px; transform: translateX(-50%);
    background: repeating-linear-gradient(160deg, var(--olle) 0 9px, var(--tangerine) 9px 18px); border-radius: 3px; opacity: .45;
  }
  .leg-body { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--stone); padding: 0 4px 12px; }
  .leg-body svg { width: 16px; height: 16px; }
  .leg.is-late .leg-body b { color: #B23A2B; }

  /* Meal options */
  .opt-h { margin: 12px 0 6px; font-size: 13px; font-weight: 700; color: var(--stone); }
  .opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .opt { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .opt.is-closed { opacity: .55; }
  .opt-name { font-weight: 700; font-size: 15px; }
  .opt-hours { font-size: 13px; color: var(--stone); margin-top: 2px; }
  .opt-note { font-size: 13px; margin-top: 4px; }
  .opt-act { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .opt-act .btn { min-height: 30px; padding: 4px 10px; font-size: 12px; }
  .unv { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; color: #8A4A0E; background: #FFF4E8; border-radius: 999px; padding: 0 7px; }
  .bad { color: #B23A2B; }
  .warn { margin: 10px 0 0; font-size: 14px; font-weight: 700; color: #8A4A0E; background: #FFF4E8; border-radius: 10px; padding: 6px 10px; }

  .empty { margin: 14px 0; padding: 22px 18px; background: var(--paper); border-radius: 20px; }
  .empty h3 { margin: 0 0 4px; font-size: 17px; }
  .empty p { margin: 0; color: var(--stone); font-size: 14px; }

  footer.info { margin-top: 28px; background: var(--paper); border-radius: 20px; padding: 16px; font-size: 14px; }
  footer.info h2 { font-size: 15px; margin: 0 0 8px; }
  footer.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
  footer.info dt { color: var(--stone); }
  footer.info dd { margin: 0; }
  .error { color: #B23A2B; }

  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
    .cover svg.art .sunrise { animation: rise 1.6s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { transform: translateY(26px); opacity: .2; } to { transform: none; opacity: 1; } }
    .stop.flash .card { animation: flash 1.2s ease-out; }
    @keyframes flash { from { box-shadow: 0 0 0 4px rgba(238,127,27,.55); } to { box-shadow: 0 0 0 0 rgba(238,127,27,0); } }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1 class="brand">濟州 4 日<span>제주도</span></h1>
    <div class="countdown" id="countdown"></div>
  </div>
  <nav class="days" role="tablist" aria-label="選擇哪一天" id="tabs"></nav>
  <main id="main" aria-live="polite"></main>
  <footer class="info" id="info"></footer>
</div>

<script>
(() => {
  /* ---------- Small helpers ---------- */
  const CAT = { experience: "體驗", walk: "散步", nature: "自然", history: "歷史", sunset: "夕陽", food: "吃飯", beach: "海邊", drive: "兜風", transport: "移動" };
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  const THEME_COLOR = { dawn: "#E9A79A", oreum: "#89A770", south: "#EE7F1B", west: "#8E7BB5" };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(Math.round(m % 60)).padStart(2, "0")}`;
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  function kstNow() {
    const k = new Date(Date.now() + 9 * 3600e3);
    return { date: k.toISOString().slice(0, 10), min: k.getUTCHours() * 60 + k.getUTCMinutes() };
  }
  const weekday = date => WEEK[new Date(date + "T12:00:00+09:00").getUTCDay()];
  const md = date => date.slice(5).replace("-", "/").replace(/^0/, "");

  /* ---------- Sunrise / sunset (NOAA sunrise equation), result in KST minutes ---------- */
  function sunTimes(date, lat, lng) {
    const rad = Math.PI / 180;
    const jd = Date.parse(date + "T12:00:00Z") / 864e5 + 2440587.5;
    const n = Math.ceil(jd - 2451545.0 + 0.0008);
    const Js = n - lng / 360;
    const M = (357.5291 + 0.98560028 * Js) % 360;
    const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
    const L = (M + C + 180 + 102.9372) % 360;
    const Jt = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
    const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.44 * rad));
    const w0 = Math.acos((Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec))) / rad;
    const toKst = J => { const ms = (J - 2440587.5) * 864e5 + 9 * 3600e3; const d = new Date(ms); return d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60; };
    return { rise: toKst(Jt - w0 / 360), set: toKst(Jt + w0 / 360) };
  }

  /* ---------- Icons ---------- */
  const IC = {
    experience: '<circle cx="12" cy="14" r="7"/><path d="M12 7c0-2 1.5-3.5 4-4-0.5 2.5-2 4-4 4z"/>',
    walk: '<path d="M7 20c2-1 2.5-4 4-6s4-2 5-5"/><circle cx="16" cy="5" r="1.6"/><path d="M4 20h16"/>',
    nature: '<path d="M2 19c3-6 6-10 10-10s7 4 10 10z"/><path d="M8 13c1.5 1 2.5 1 4 0s2.5-1 4 0"/>',
    history: '<path d="M4 20h16M6 20V10M10 20V10M14 20V10M18 20V10M3 10l9-5 9 5z"/>',
    sunset: '<path d="M3 17h18M6 21h12"/><path d="M7 17a5 5 0 0 1 10 0"/><path d="M12 6v3M4.9 9.5l2 2M19.1 9.5l-2 2"/>',
    food: '<path d="M3 12h18a9 9 0 0 1-18 0z"/><path d="M14 3l-3 7M19 4l-5 6"/>',
    beach: '<path d="M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6-1"/><path d="M2 19c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6-1"/><circle cx="17" cy="7" r="3"/>',
    drive: '<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="16" r="1.5"/><circle cx="16.5" cy="16" r="1.5"/>',
    transport: '<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/>',
    plane: '<path d="M2 13l8-1 5-8h2l-2 8 5 0 2-2h1l-1 4 1 4h-1l-2-2-5 0 2 8h-2l-5-8-8-1z"/>',
    nav: '<path d="M3 11l18-8-8 18-2-8z"/>',
    map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>'
  };
  const icon = (k, color = "currentColor") => `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k] || IC.nature}</svg>`;

  /* ---------- Weather ---------- */
  function wmo(code) {
    if (code === 0) return ["晴", "sun"];
    if (code <= 2) return ["晴時多雲", "partly"];
    if (code === 3) return ["陰", "cloud"];
    if (code === 45 || code === 48) return ["起霧", "fog"];
    if (code >= 51 && code <= 57) return ["毛毛雨", "rain"];
    if (code >= 61 && code <= 67) return ["下雨", "rain"];
    if (code >= 71 && code <= 77) return ["下雪", "snow"];
    if (code >= 80 && code <= 82) return ["陣雨", "rain"];
    if (code >= 95) return ["雷雨", "rain"];
    return ["多雲", "cloud"];
  }
  function wxIcon(kind) {
    const sun = '<circle cx="24" cy="24" r="9" fill="#F7B23B"/><g stroke="#F7B23B" stroke-width="3" stroke-linecap="round"><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11 11l3.5 3.5M33.5 33.5L37 37M11 37l3.5-3.5M33.5 14.5L37 11"/></g>';
    const cloud = (x = 0, y = 0, c = "#C7D0D3") => `<path transform="translate(${x} ${y})" d="M14 38h22a8 8 0 0 0 0-16 11 11 0 0 0-21-2 9 9 0 0 0-1 18z" fill="${c}"/>`;
    const map = {
      sun,
      partly: `<g transform="translate(-6 -6) scale(.8)">${sun}</g>${cloud(4, 4, "#D5DDE0")}`,
      cloud: cloud(0, 0, "#B9C3C7"),
      fog: `${cloud(0, -4, "#C7D0D3")}<g stroke="#9AA6AA" stroke-width="3" stroke-linecap="round"><path d="M10 42h28M14 46h20"/></g>`,
      rain: `${cloud(0, -6, "#A9B6BC")}<g stroke="#2F7FA0" stroke-width="3" stroke-linecap="round"><path d="M17 38l-2 6M25 38l-2 6M33 38l-2 6"/></g>`,
      snow: `${cloud(0, -6, "#C7D0D3")}<g fill="#9DB7D6"><circle cx="17" cy="42" r="2.2"/><circle cx="25" cy="44" r="2.2"/><circle cx="33" cy="42" r="2.2"/></g>`,
      avg: `<g transform="translate(-6 -6) scale(.8)">${sun}</g>${cloud(4, 4, "#D5DDE0")}`
    };
    return `<svg viewBox="0 0 48 48" aria-hidden="true">${map[kind] || map.cloud}</svg>`;
  }
  const WX_TTL = 3 * 3600e3;
  async function getWeather(day) {
    const pt = day.weather_point; if (!pt) return null;
    const key = `wx-${day.date}`;
    const cached = ls.get(key, null);
    if (cached && Date.now() - cached.t < WX_TTL) return cached.v;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${pt.lat}&longitude=${pt.lng}` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,apparent_temperature_min` +
      `&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=16`;
    try {
      const r = await fetch(url); if (!r.ok) throw 0;
      const j = await r.json();
      const i = j.daily.time.indexOf(day.date);
      if (i < 0) return cached ? cached.v : null;
      const v = {
        code: j.daily.weather_code[i], max: j.daily.temperature_2m_max[i], min: j.daily.temperature_2m_min[i],
        feel: j.daily.apparent_temperature_min[i], rain: j.daily.precipitation_probability_max[i], wind: j.daily.wind_speed_10m_max[i]
      };
      ls.set(key, { t: Date.now(), v });
      return v;
    } catch { return cached ? cached.v : null; }
  }
  function wxAdvice(w, day) {
    const out = [];
    if (w.wind != null && w.wind >= 8) out.push("風很大：帶防風外套，帽子要綁好");
    if (w.min != null && w.min <= 8) out.push("早晚很冷，洋蔥式穿法");
    else if (w.min != null && w.min <= 12) out.push("早晚涼，帶件薄外套");
    if (w.rain != null && w.rain >= 50) {
      const pick = day.stops.some(s => s.category === "experience");
      out.push(pick ? "可能下雨：帶傘，摘橘子雨天不開放" : "可能下雨：記得帶傘");
    }
    return out.join("；") || "天氣不錯，適合走步道";
  }

  /* ---------- Map ---------- */
  const S = 1000, LNG0 = 126.10, LAT0 = 33.60, KX = 0.835;
  const px = (lng, lat) => [((lng - LNG0) * KX * S), ((LAT0 - lat) * S)];
  const COAST = [
    [126.162,33.300],[126.165,33.335],[126.185,33.360],[126.230,33.395],[126.270,33.420],[126.310,33.455],
    [126.360,33.475],[126.420,33.490],[126.490,33.510],[126.530,33.520],[126.600,33.530],[126.670,33.545],
    [126.750,33.565],[126.820,33.555],[126.870,33.525],[126.920,33.500],[126.945,33.460],[126.920,33.430],
    [126.860,33.370],[126.830,33.320],[126.750,33.290],[126.660,33.265],[126.580,33.245],[126.500,33.235],
    [126.420,33.240],[126.360,33.235],[126.320,33.225],[126.300,33.205],[126.290,33.195],[126.250,33.210],
    [126.210,33.240],[126.175,33.270]
  ];
  const COAST_D = (() => {
    const p = COAST.map(([a, b]) => px(a, b));
    const mid = i => { const a = p[i], b = p[(i + 1) % p.length]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
    let d = `M${mid(p.length - 1).map(n => n.toFixed(1)).join(",")}`;
    p.forEach((pt, i) => { const m = mid(i); d += ` Q${pt[0].toFixed(1)},${pt[1].toFixed(1)} ${m[0].toFixed(1)},${m[1].toFixed(1)}`; });
    return d + "Z";
  })();

  /* ---------- State ---------- */
  let done = ls.get("jeju-done", {});
  let trip = null, current = 0;
  let plans = ls.get("jeju-plan", {});
  const planOf = day => (plans[day.date] === "rain" && day.rain_plan) ? "rain" : "sun";
  const stopsOf = day => planOf(day) === "rain" ? day.rain_plan.stops : day.stops;
  const stopKey = (day, i) => `${day.date}#${planOf(day)}#${i}`;
  const WD = date => new Date(date + "T12:00:00+09:00").getUTCDay();
  const isPlace = s => s.category !== "transport";

  function nextIndex(day) {
    const now = kstNow();
    if (now.date !== day.date) return -1;
    return stopsOf(day).findIndex((s, i) => !done[stopKey(day, i)] && isPlace(s) && toMin(s.time) + (s.duration_min || 30) > now.min);
  }

  function navLinks(s) {
    const q = encodeURIComponent(s.name_ko || s.name);
    const out = [];
    if (s.search_q) {
      const sq = encodeURIComponent(s.search_q);
      out.push(`<a class="btn primary nav-btn" href="https://map.kakao.com/link/search/${sq}" target="_blank" rel="noopener">${icon("nav")}找地點</a>`);
      return out.join("");
    }
    if (s.options) return "";
    if (s.lat != null && s.lng != null && s.approx && s.name_ko) out.push(`<a class="btn primary nav-btn" href="https://map.kakao.com/link/search/${q}" target="_blank" rel="noopener">${icon("nav")}導航</a>`);
    else if (s.lat != null && s.lng != null) out.push(`<a class="btn primary nav-btn" href="https://map.kakao.com/link/to/${q},${s.lat},${s.lng}" target="_blank" rel="noopener">${icon("nav")}導航</a>`);
    else if (!isPlace(s)) return "";
    else if (s.name_ko) out.push(`<a class="btn primary nav-btn" href="https://map.kakao.com/link/search/${q}" target="_blank" rel="noopener">${icon("nav")}找附近</a>`);
    if (s.name_ko) out.push(`<a class="btn nav-btn" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">${icon("map")}Naver</a>`);
    return out.join("");
  }

  /* ---------- Render pieces ---------- */
  function renderCover(day, stats) {
    return `<section class="cover" aria-label="Day ${day.day} 封面">

  function renderWx(day, w) {
    const pt = day.weather_point || { lat: 33.38, lng: 126.53 };
    const sun = sunTimes(day.date, pt.lat, pt.lng);
    const sunBlock = `<div class="wx-sun">日落<b>${hhmm(sun.set)}</b>日出 ${hhmm(sun.rise)}</div>`;
    if (w) {
      const [desc, kind] = wmo(w.code);
      return `<section class="wx" aria-label="天氣">
        <div class="wx-main">
          <div class="wx-icon">${wxIcon(kind)}</div>
          <div><div class="wx-temp">${Math.round(w.max)}° <span class="lo">/ ${Math.round(w.min)}°</span></div>

          <div>降雨機率<b>${w.rain ?? "–"}%</b></div>

          <div>白天長度<b>${Math.floor((sun.set - sun.rise) / 60)}h${String(Math.round((sun.set - sun.rise) % 60)).padStart(2, "0")}</b></div>
        </div>

      <div class="wx-main">

        <div><div class="wx-temp">15° <span class="lo">/ 8°</span></div>

    </section>`;
  }

  function renderPlan(day, w) {
    if (!day.rain_plan) return "";
    const p = planOf(day);
    const bad = w && ((w.rain ?? 0) >= 60 || (w.wind ?? 0) >= 12);
    const alert = bad && p === "sun" ? `<p class="plan-alert">預報${(w.rain ?? 0) >= 60 ? `降雨機率 ${w.rain}%` : `風速 ${Math.round(w.wind)} m/s`}，建議切到雨天備案</p>` : "";
    return `<section class="plan" aria-label="選擇行程">
      <div class="seg" role="group" aria-label="晴天或雨天行程">
        <button type="button" data-plan="sun" aria-pressed="${p === "sun"}">晴天行程</button>
        <button type="button" data-plan="rain" aria-pressed="${p === "rain"}">雨天備案</button>
      </div>
      ${alert}
      ${p === "rain" ? `<p class="plan-note">${esc(day.rain_plan.note)}</p>` : ""}
    </section>`;
  }

  function renderMap(day, nextIdx) {
    const pinned = stopsOf(day).map((s, i) => ({ s, i })).filter(o => o.s.lat != null && (isPlace(o.s) || /機場（/.test(o.s.name)));
    if (!pinned.length) return "";
    const others = trip.days.filter(d => d !== day).flatMap(d => d.stops).filter(s => s.lat != null);
    const pts = pinned.map(o => px(o.s.lng, o.s.lat));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    let w = Math.max(x1 - x0 + 120, 320), h = Math.max(y1 - y0 + 90, w * 0.48);
    w = Math.max(w, h / 0.48);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const vb = [cx - w / 2, cy - h / 2, w, h].map(n => n.toFixed(1)).join(" ");
    const f = w / 360;
    const labels = [
      { t: "濟州市", lng: 126.53, lat: 33.50, dy: 16 }, { t: "西歸浦", lng: 126.56, lat: 33.255, dy: -10 },
      { t: "漢拏山 ▲", lng: 126.533, lat: 33.362, dy: 4 }, { t: "翰林", lng: 126.29, lat: 33.41, dy: 16 },
      { t: "中文", lng: 126.42, lat: 33.255, dy: -6 }
    ];
    const order = new Map(); let n = 0;
    stopsOf(day).forEach((s, i) => { if (isPlace(s)) order.set(i, ++n); });
    const route = pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ");
    return `<div class="map">
      <svg viewBox="${vb}" role="img" aria-label="${esc(md(day.date))} 的路線圖">
        <path class="island" d="${COAST_D}" vector-effect="non-scaling-stroke"/>
        ${labels.map(l => { const [x, y] = px(l.lng, l.lat); return `<text class="label" style="font-size:${(11 * f).toFixed(1)}px" x="${x.toFixed(0)}" y="${(y + l.dy * f).toFixed(0)}" text-anchor="middle">${l.t}</text>`; }).join("")}
        ${others.map(s => { const [x, y] = px(s.lng, s.lat); return `<circle class="ghost" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(3 * f).toFixed(1)}"/>`; }).join("")}
        ${pinned.length > 1 ? `<polyline class="route" points="${route}" vector-effect="non-scaling-stroke"/>` : ""}
        ${pinned.map(({ s, i }) => {
          const [x, y] = px(s.lng, s.lat);
          const cls = ["pin", done[stopKey(day, i)] ? "is-done" : "", i === nextIdx ? "is-next" : ""].join(" ");
          return `<g class="${cls}" data-go="${i}" tabindex="0" role="button" aria-label="跳到 ${esc(s.name)}">
            <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(10 * f).toFixed(1)}" style="stroke-width:${(2 * f).toFixed(1)}"/>
            <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${(10 * f).toFixed(1)}px">${order.get(i) ?? "✈"}</text></g>`;
        }).join("")}
      </svg></div>
      <p class="map-note">點地圖上的編號，會跳到那一站</p>`;
  }

  function flightRow(f, kind) {
    const arr = kind === "arr";
    return `<li class="stop is-flight">
      <div class="time">${arr ? f.arr : f.dep}</div>
      <div class="rail"><div class="dot">✈</div></div>
      <div class="card flight-card"><div class="card-head">
        <div class="cat-ic" style="background:#fff">${icon("plane", "#2F64A8")}</div>
        <div><h4>${arr ? "抵達濟州機場" : "起飛回臺中"}</h4>
        <p class="sub">${esc(f.airline)} ${esc(f.flight)}・${esc(f.from)} ${f.dep} → ${esc(f.to)} ${f.arr}</p></div>
      </div></div></li>`;
  }

  function stopRow(day, s, i, num, nextIdx) {
    const key = stopKey(day, i);
    const move = !isPlace(s), isDone = !!done[key], sunset = s.category === "sunset";
    const color = `var(--c-${s.category})`;
    const cls = ["stop", move ? "is-move" : "", isDone ? "is-done" : "", i === nextIdx ? "is-next" : "", sunset ? "is-sunset" : ""].join(" ");
    let sunsetBlock = "";
    if (sunset && s.lat != null) {
      const set = sunTimes(day.date, s.lat, s.lng).set;
      sunsetBlock = `<div class="sunset-time"><b>${hhmm(set)}</b><span>日落・${hhmm(set - 20)} 前到，最美的是日落後 15 分鐘</span></div>`;
    }
    const chips = move ? "" : `<span class="chip" style="background:color-mix(in srgb, ${color} 14%, white);color:${color}">${CAT[s.category] || ""}</span>`;
    const tips = (s.tips || []).filter(t => !(sunset && /日落約/.test(t)));
    const wd = WD(day.date);
    const opts = (s.options || []).map(o => {
      const closed = o.closed.includes(wd);
      const qq = encodeURIComponent(o.q || o.name_ko);
      return `<li class="opt${closed ? " is-closed" : ""}">
        <div class="opt-name">${esc(o.name)}</div>
        <div class="opt-hours">${closed ? `<b class="bad">${WEEK[wd]}公休</b>　` : ""}${esc(o.hours)}${o.verified ? "" : `<span class="unv">待確認</span>`}</div>
        ${o.note ? `<div class="opt-note">${esc(o.note)}</div>` : ""}
        ${o.name_ko && o.name !== "改在機場吃" ? `<div class="opt-act">
          <a class="btn primary" href="https://map.kakao.com/link/search/${qq}" target="_blank" rel="noopener">${icon("nav")}Kakao</a>
          <a class="btn" href="https://map.naver.com/p/search/${qq}" target="_blank" rel="noopener">${icon("map")}Naver</a></div>` : ""}
      </li>`;
    }).join("");
    const warn = s.warn === "tight" ? `<p class="warn">⚠ 到機場的時間偏緊</p>` : "";
    return `<li class="${cls}" id="stop-${i}">
      <div class="time">${esc(s.time)}</div>
      <div class="rail"><div class="dot">${move ? "" : num}</div></div>
      <div class="card">
        <div class="card-head">
          <div class="cat-ic" style="background:color-mix(in srgb, ${color} 14%, white)">${icon(s.category, color)}</div>
          <div>
            <h4>${esc(s.name)}${i === nextIdx ? `<span class="next-tag">下一站</span>` : ""}</h4>
            ${s.name_ko && !move ? `<p class="sub" lang="ko">${esc(s.name_ko)}</p>` : ""}
            <p class="sub">${chips}${s.duration_min ? `約 ${s.duration_min} 分鐘` : ""}</p>
          </div>
        </div>
        ${sunsetBlock}
        ${warn}
        ${tips.length ? `<ul class="tips">${tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
        ${opts ? `<p class="opt-h">挑一家</p><ul class="opts">${opts}</ul>` : ""}
        ${move && !navLinks(s) ? "" : `<div class="actions">${navLinks(s)}
          ${move ? "" : `<button class="btn check" type="button" data-check="${i}" aria-pressed="${isDone}">${isDone ? "✓ 去過了" : "去過了"}</button>`}</div>`}
      </div></li>`;
  }

  function renderDay() {
    const day = trip.days[current];
    const main = document.getElementById("main");
    const arr = trip.trip.flights.find(f => f.date === day.date && f.to === "CJU");
    const dep = trip.trip.flights.find(f => f.date === day.date && f.from === "CJU");
    const places = stopsOf(day).filter(isPlace).length;
    const stats = places ? `${places} 站・${stopsOf(day)[0].time} 出發` : "";
    let html = renderCover(day, stats);
    const cachedWx = ls.get(`wx-${day.date}`, null)?.v || null;
    html += `<div id="wx-slot">${renderWx(day, cachedWx)}</div>`;
    html += `<div id="plan-slot">${renderPlan(day, cachedWx)}</div>`;

    if (!stopsOf(day).length) {
      html += `<div class="section-h"><h3>行程</h3></div><ol class="timeline">${arr ? flightRow(arr, "arr") : ""}</ol>
        <div class="empty"><h3>這天的行程還沒放進來</h3>
        <p>朋友排好後，加進 data/itinerary.json 的 Day ${day.day}，就會出現在這裡。</p></div>`;
    } else {
      const nextIdx = nextIndex(day);
      html += renderMap(day, nextIdx);
      const doneCount = stopsOf(day).filter((s, i) => isPlace(s) && done[stopKey(day, i)]).length;
      html += `<div class="section-h"><h3>行程</h3><span>${doneCount ? `已去 ${doneCount} / ${places} 站` : `${places} 站`}</span></div>`;
      let n = 0;
      html += `<ol class="timeline">${arr ? flightRow(arr, "arr") : ""}`;
      const list = stopsOf(day);
      list.forEach((s, i) => {
        const p = list[i - 1];
        if (p && s.drive_min != null && s.drive_min > 0) {
          const late = toMin(p.time) + (p.duration_min || 0) + s.drive_min - toMin(s.time);
          html += `<li class="leg${late > 0 ? " is-late" : ""}"><div></div><div class="rail"></div>
            <div class="leg-body">${icon("drive")}開車約 ${s.drive_min} 分${late > 0 ? `<b>・會晚到 ${late} 分</b>` : ""}</div></li>`;
        }
        html += stopRow(day, s, i, isPlace(s) ? ++n : 0, nextIdx);
      });
      html += `${dep ? flightRow(dep, "dep") : ""}</ol>`;
    }
    main.innerHTML = html;

    const shown = day;
    getWeather(day).then(w => {
      if (trip.days[current] !== shown) return;
      const slot = document.getElementById("wx-slot");
      if (slot) slot.innerHTML = renderWx(day, w);
      const ps = document.getElementById("plan-slot");
      if (ps) ps.innerHTML = renderPlan(day, w);
    });
  }

  function renderTabs() {
    const today = kstNow().date;
    document.getElementById("tabs").innerHTML = trip.days.map((d, i) => `
      <button class="day-tab" role="tab" type="button" data-day="${i}" aria-selected="${i === current}">
        <span class="d">${md(d.date)}</span>
        <span class="w">${weekday(d.date)}・${esc(d.title || "")}${d.date === today ? `<span class="today-dot" aria-label="今天"></span>` : ""}</span>
        <span class="bar" style="background:${THEME_COLOR[d.theme] || "#ccc"}"></span>
      </button>`).join("");
  }

  function renderCountdown() {
    const el = document.getElementById("countdown");
    const start = trip.days[0].date, end = trip.days[trip.days.length - 1].date, today = kstNow().date;
    const diff = Math.round((Date.parse(start) - Date.parse(today)) / 864e5);
    if (diff > 0) el.innerHTML = `還有<strong>${diff}</strong>天`;
    else if (today <= end) el.innerHTML = `第<strong>${-diff + 1}</strong>天`;
    else el.textContent = "旅程結束";
  }

  function renderInfo() {
    const t = trip.trip;
    const f = t.flights.map(x => `<dt>${md(x.date)}</dt><dd>${esc(x.airline)} ${esc(x.flight)}　${esc(x.from)} ${x.dep} → ${esc(x.to)} ${x.arr}</dd>`).join("");
    const docs = t.transport?.docs ? `<dt>租車</dt><dd>帶：${t.transport.docs.map(esc).join("、")}</dd>` : "";
    const stay = t.lodging ? `<dt>住宿</dt><dd>${esc(t.lodging.area)}</dd>` : "";
    const dn = t.drive_note ? `<dt>車程</dt><dd>${esc(t.drive_note)}</dd>` : "";
    document.getElementById("info").innerHTML = `<h2>航班與提醒</h2><dl>${f}${docs}${stay}${dn}</dl>`;
  }

  function selectDay(i, focus) {
    current = i; ls.set("jeju-day", i);
    renderTabs(); renderDay();
    if (focus) document.querySelector(`[data-day="${i}"]`)?.focus();
  }
  function jump(i) {
    const el = document.getElementById("stop-" + i); if (!el) return;
    el.scrollIntoView({ block: "center" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  document.addEventListener("click", e => {
    const tab = e.target.closest("[data-day]");
    if (tab) { selectDay(Number(tab.dataset.day)); return; }
    const chk = e.target.closest("[data-check]");
    if (chk) {
      const key = stopKey(trip.days[current], Number(chk.dataset.check));
      if (done[key]) delete done[key]; else done[key] = Date.now();
      ls.set("jeju-done", done); renderDay(); return;
    }
    const pl = e.target.closest("[data-plan]");
    if (pl) {
      plans[trip.days[current].date] = pl.dataset.plan; ls.set("jeju-plan", plans);
      const y = window.scrollY; renderDay(); window.scrollTo(0, y); return;
    }
    const go = e.target.closest("[data-go]");
    if (go) jump(Number(go.dataset.go));
  });
  document.addEventListener("keydown", e => {
    const t = e.target.closest ? e.target : null; if (!t) return;
    const go = t.closest("[data-go]");
    if (go && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); jump(Number(go.dataset.go)); }
    const tab = t.closest("[data-day]");
    if (tab && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const n = trip.days.length; selectDay((current + (e.key === "ArrowRight" ? 1 : n - 1)) % n, true);
    }
  });

  function start(data) {
    trip = data;
    const today = kstNow().date;
    const todayIdx = trip.days.findIndex(d => d.date === today);
    const saved = ls.get("jeju-day", null);
    const firstFilled = trip.days.findIndex(d => d.stops.length);
    current = todayIdx >= 0 ? todayIdx : (saved != null && trip.days[saved] ? saved : Math.max(firstFilled, 0));
    renderCountdown(); renderTabs(); renderDay(); renderInfo();
    if (todayIdx >= 0) { const n = nextIndex(trip.days[todayIdx]); if (n >= 0) setTimeout(() => jump(n), 400); }
  }

  fetch("data/itinerary.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(start)
    .catch(() => { document.getElementById("main").innerHTML = `<p class="error">讀不到行程資料（data/itinerary.json）。請用網址開啟這個頁面，不要直接點開檔案。</p>`; });

  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
